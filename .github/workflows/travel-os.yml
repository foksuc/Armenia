name: Travel OS
on:
  push:
    branches: [feature/travel-os-rebuild, 'trip/**', release/travel-os]
    paths: ['travel-os/**', '.github/workflows/travel-os.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: travel-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: travel-os/package-lock.json
      - run: npm ci
      - run: npm run types:generate && git diff --exit-code src/trip.generated.ts
      - run: npm run typecheck && npm run lint && npm test
      - run: npm run build:preview
      - run: npx playwright install --with-deps chromium
      - run: |
          npm run dev -- --host 127.0.0.1 --port 4173 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ && break || sleep 1; done
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:4173 npm run test:e2e
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: travel-os-qa
          path: |
            travel-os/playwright-report
            travel-os/test-results
            travel-os/dist
